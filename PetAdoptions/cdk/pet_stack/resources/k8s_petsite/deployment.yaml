---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: "{{PETSITE_SA_ROLE}}"
  name: petsite-sa
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: service-petsite
  namespace: default
  annotations:
    scrape: "true"
    prometheus.io/scrape: "true"
spec:
  ports:
  - port: 80
    nodePort: 30300
    targetPort: 80
    protocol: TCP
  type: NodePort
  selector:
    app: petsite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsite-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: petsite
  replicas: 2
  template:
    metadata:
      labels:
        app: petsite
    spec:
      serviceAccountName: petsite-sa
      containers:
      - image: "{{ECR_IMAGE_URL}}"
        imagePullPolicy: Always
        name: petsite
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: 800m
            memory: 300Mi
          requests:
            cpu: 400m
            memory: 200Mi
        env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service.default:2000
        - name: SERVICE_NAME
          value: petsite
        # Location context for log enrichment (FIS fault attribution).
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-tgb
spec:
  serviceRef:
    name: service-petsite
    port: 80
  targetGroupARN: "<arn-to-targetGroup>"
  targetType: ip
---
# Read-only access to node objects so the pod can resolve its own AZ from the
# node's topology.kubernetes.io/zone label (IMDS is unreachable from EKS pods).
# Scoped to get on nodes only. NOTE: applications.ts indexes the docs in this
# file positionally ([0] SA, [2] Deployment, [3] TargetGroupBinding) — these two
# docs are appended last so those indices are unaffected.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: petsite-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: petsite-node-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: petsite-node-reader
subjects:
  - kind: ServiceAccount
    name: petsite-sa
    namespace: default
