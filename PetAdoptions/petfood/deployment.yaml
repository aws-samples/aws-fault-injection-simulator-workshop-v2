---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petfood-sa
  namespace: default
---
# Read-only access to node objects so the pod can resolve its own AZ from the
# node's topology.kubernetes.io/zone label (IMDS is unreachable from EKS pods).
# Scoped to get on nodes only — no write, no other resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: petfood-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: petfood-node-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: petfood-node-reader
subjects:
  - kind: ServiceAccount
    name: petfood-sa
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petfood
  labels:
    app: petfood
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petfood
  template:
    metadata:
      labels:
        app: petfood
    spec:
      serviceAccountName: petfood-sa
      containers:
      - env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service:2000
        - name: AWS_DEFAULT_REGION
          value: DEPLOYMENTREGION
        # Location context for log enrichment (FIS fault attribution). EKS pods
        # have no AZ, so ranking is by node (EC2 instance via downward API).
        - name: SERVICE_NAME
          value: petfood
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        name: petfood
        image: DEPLOYMENTACCOUNT.dkr.ecr.DEPLOYMENTREGION.amazonaws.com/petfood:1
        ports:
        - containerPort: 5000
#        livenessProbe:
#          httpGet:
#            path: /status
#            port: 5000
#          initialDelaySeconds: 3
#          periodSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: petfood
  labels:
    app: petfood
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 5000
  selector:
    app: petfood
