AWSTemplateFormatVersion: '2010-09-09'
Description: "AWS FIS workshop - EC2/static stack. Launch Windows Instance for CPU Stress Test during FIS Workshop."
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: EC2 Instance Configuration
        Parameters:
          - WindowsImageId
          - InstanceType
    ParameterLabels:
      WindowsImageId:
        default: AMZ Windows Amazon Machine Image (AMI) Id
      InstanceType:
        default: EC2 Instance Type
Parameters:
  WindowsImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2019-English-Full-Base
    Description: 'SSM Parameter for Windows 2019 AMI.'
  LinuxImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: 'SSM Parameter for the latest Amazon Linux 2023 x86_64 AMI.'
  InstanceType:
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
    Default: t3.medium
    Description: Amazon EC2 instance type for the Internet Information Services servers
    Type: String
  SubnetId:
   Description: Subnet in which to instantiate VM - needed if no Default VPC was configured
   # Can't use Type: AWS::EC2::Subnet::Id because it checks the default before the condition
   Type: String
   AllowedPattern: "subnet-[a-z0-9]+"
   Default: "subnet-000000"
Conditions:
  UseDefaultVpc:
    !Equals
      - !Ref SubnetId
      - "subnet-000000"
Resources:
  SSMInstanceRole:
    Type : AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: "Allow"
          Principal:
            Service:
            - "ec2.amazonaws.com"
          Action: "sts:AssumeRole"
  SSMInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Roles:
      - !Ref SSMInstanceRole
  WindowsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref 'WindowsImageId'
      IamInstanceProfile: !Ref 'SSMInstanceProfile'
      InstanceType: !Ref 'InstanceType'
      Monitoring: true
      SubnetId: !If [UseDefaultVpc, !Ref "AWS::NoValue", !Ref SubnetId]
      Tags:
        - Key: Name
          Value: 'FisWindowsCPUStress'

  FISRole:
    Type: AWS::IAM::Role
    Properties:
      # Explicit name so the lab guides can tell participants to select
      # "FisCpuStress-FISRole" in the FIS execution-role dropdown. Without this,
      # CloudFormation generates a random suffix (FisCpuStress-FISRole-XXXX) that
      # would not match the name printed in the 020 and 040 lab pages. Requires
      # CAPABILITY_NAMED_IAM (setup-ssm-experiment.sh already passes it).
      RoleName: FisCpuStress-FISRole
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:CreateLogDelivery
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:ListCommands
                  - ssm:ListDocuments
                  # Required so FIS can poll the SSM command status (without
                  # GetCommandInvocation the aws:ssm:send-command action reports
                  # "Not enough privileges") and cancel the command for rollback
                  # when a stop condition halts the experiment.
                  - ssm:GetCommandInvocation
                  - ssm:CancelCommand
                Resource: '*'
              # Required for CloudWatch alarm stop conditions: FIS must be able to
              # read the alarm state to decide whether to halt a running experiment.
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:*:*:document/AWSFIS-Run-*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${WinStressDocument}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
          PolicyName: SSMPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
              - "fis.amazonaws.com"
            Action: sts:AssumeRole

  # ----------------------------------------------------------------------------
  # Stop-condition teaching example
  #
  # The resources below back the "Stop conditions" lab page (040_stop_condition).
  # They are pre-deployed so a participant only has to SELECT and START the
  # experiment, then watch the CloudWatch alarm automatically halt it.
  #
  #   LinuxInstance          -> dedicated, isolated CPU-stress target (AL2023)
  #   CPUStressAlarm         -> alarms on the instance's native CPUUtilization
  #   FISExperimentCPUStress -> the experiment whose StopCondition IS that alarm
  #
  # Experiment logs go to the shared "FISExperiments" CloudWatch log group that
  # the workshop already provisions; we reference it by ARN (see LogConfiguration
  # below) instead of creating a new log group, to avoid a name collision.
  #
  # We use a dedicated Linux instance + the AWS-managed AWSFIS-Run-CPU-Stress
  # document (stress-ng) so no custom SSM document is needed and the breach is
  # driven by the native AWS/EC2 CPUUtilization metric (detailed monitoring on).
  # ----------------------------------------------------------------------------
  LinuxInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref 'LinuxImageId'
      IamInstanceProfile: !Ref 'SSMInstanceProfile'
      InstanceType: !Ref 'InstanceType'
      Monitoring: true
      SubnetId: !If [UseDefaultVpc, !Ref "AWS::NoValue", !Ref SubnetId]
      Tags:
        - Key: Name
          Value: 'FisLinuxCPUStress'

  # The safeguard: an alarm on the stress instance's native CPUUtilization.
  # Stress drives CPU to ~100%, so a single 60s datapoint >= 50% trips it.
  # This is a plain (single-metric) alarm - FIS stop conditions cannot use
  # math/SEARCH() expression alarms.
  CPUStressAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: FisCpuStress-CPUHigh
      AlarmDescription: >-
        Stop-condition alarm for the FIS CPU stress teaching example. Fires when
        the dedicated stress instance sustains high CPU, causing FIS to halt the
        experiment automatically.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref LinuxInstance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # The experiment. Its StopConditions source is the alarm ARN, so when the
  # alarm transitions to ALARM, FIS stops this experiment. The action duration
  # (PT10M) is deliberately MUCH longer than the time it takes the alarm to
  # fire, so the stop condition pre-empts normal completion - that is the whole
  # point of the demo.
  FISExperimentCPUStress:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: CPU stress on a dedicated Linux instance, halted by a CloudWatch alarm stop condition
      RoleArn: !GetAtt FISRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt CPUStressAlarm.Arn
      # Reuse the shared "FISExperiments" CloudWatch log group that the workshop
      # already provisions (referenced as a log destination by the 020 Linux
      # stress lab). We point at it by ARN rather than creating a new log group,
      # to avoid a name collision with the existing one.
      LogConfiguration:
        LogSchemaVersion: 2
        CloudWatchLogsConfiguration:
          LogGroupArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:FISExperiments:*
      Tags:
        Name: StopConditionBurnCPUViaSSM
      Targets:
        instanceTargets:
          ResourceArns:
            - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${LinuxInstance}
          ResourceType: aws:ec2:instance
          SelectionMode: ALL
      Actions:
        instanceActions:
          ActionId: aws:ssm:send-command
          Description: Inject CPU stress via the AWS-managed AWSFIS-Run-CPU-Stress SSM document
          Parameters:
            documentArn: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWSFIS-Run-CPU-Stress
            documentParameters: '{"DurationSeconds":"600","InstallDependencies":"True"}'
            duration: PT10M
          Targets:
            Instances: instanceTargets

  WinStressDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content: |
        {
            "schemaVersion": "2.2",
            "description": "Stress Windows CPU.",
            "parameters": {
              "workingDirectory": {
                "type": "String",
                "default": "",
                "description": "(Optional) The path to the working directory on your instance.",
                "maxChars": 4096
              },
              "durationSeconds": {
                "type": "String",
                "default": "120",
                "description": "Duration of test in seconds.",
                "allowedPattern": "([1-9][0-9]{0,4})|(1[0-6][0-9]{4})|(17[0-1][0-9]{3})|(172[0-7][0-9]{2})|(172800)"
              },
              "executionTimeout": {
                "type": "String",
                "default": "3600",
                "description": "(Optional) The time in seconds for a command to be completed before it is considered to have failed. Default is 3600 (1 hour). Maximum is 172800 (48 hours).",
                "allowedPattern": "([1-9][0-9]{0,4})|(1[0-6][0-9]{4})|(17[0-1][0-9]{3})|(172[0-7][0-9]{2})|(172800)"
              }
            },
            "mainSteps": [
              {
                "action": "aws:runPowerShellScript",
                "name": "invokeCpuStress",
                "precondition": {
                  "StringEquals": [
                    "platformType",
                    "Windows"
                  ]
                },
                "inputs": {
                  "runCommand": [
                    "try {",
                    "    $NumThreads = Get-WmiObject win32_processor | Select-Object -ExpandProperty NumberOfLogicalProcessors",
                    "    $StartDate = Get-Date -ErrorAction Stop",
                    "    Write-Output \"============= CPU Stress Test Started: $StartDate =============\"",
                    "    foreach ($loopnumber in 1..$NumThreads){",
                    "        Start-Job -ScriptBlock{",
                    "        $result = 1",
                    "            foreach ($number in 1..2147483647){",
                    "                $result = $result * $number",
                    "            }",
                    "        } -Name SSMCpuJob$loopnumber -ErrorAction Stop",
                    "    }",
                    "    Start-Sleep -s {{durationSeconds}}",
                    "    Stop-Job -Name SSMCpuJob* -ErrorAction Stop",
                    "    $EndDate = Get-Date -ErrorAction Stop",
                    "    Write-Output \"============= CPU Stress Test Complete: $EndDate =============\"",
                    "    Get-Job -ErrorAction Stop | Remove-Job -ErrorAction Stop",
                    "} catch {",
                    "    Write-Host \"Failed to Run CPU Stress Test\"",
                    "    Get-Job -ErrorAction Stop | Remove-Job -ErrorAction Stop",
                    "    Exit 1",
                    "}"
                  ]
                }
              }
            ]
        }
Outputs:
  WinStressDocumentArn:
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${WinStressDocument}
  WindowsInstanceId:
    Value: !Ref WindowsInstance
  LinuxInstanceId:
    Description: Instance ID of the dedicated Linux CPU-stress target for the stop-condition example
    Value: !Ref LinuxInstance
  CPUStressAlarmArn:
    Description: ARN of the CloudWatch alarm used as the FIS experiment stop condition
    Value: !GetAtt CPUStressAlarm.Arn
  FISExperimentCPUStressId:
    Description: ID of the pre-wired FIS experiment template with the CloudWatch alarm stop condition
    Value: !Ref FISExperimentCPUStress
